<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, four routers, all ten library modules, configuration, JSON storage, and a numbered nine-step order placement flow. Invoice and tax modules are highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 9; }
      .group { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .highlight { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; rx: 9; }
      .data { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 9; }
      .config { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 9; }
      .name { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 12px Arial, sans-serif; fill: #475569; }
      .small { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .flow-line { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow); }
      .dep-line { fill: none; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 5 4; marker-end: url(#arrow-muted); }
      .step { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.4; rx: 8; }
      .step-num { fill: #2563eb; }
      .step-num-text { font: 700 13px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .legend { font: 400 12px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="800"/>
  <text class="title" x="30" y="38">ShopLedger architecture</text>
  <text class="subtitle" x="30" y="60">Node / Express POS · Khata credit ledger · GST invoicing · JSON persistence</text>

  <!-- Browser UI -->
  <text class="section" x="30" y="92">CLIENT</text>
  <rect class="group" x="25" y="104" width="205" height="300"/>
  <rect class="box" x="40" y="122" width="175" height="82"/>
  <text class="name" x="55" y="148">Browser UI</text>
  <text class="body" x="55" y="170">public/index.html</text>
  <text class="body" x="55" y="189">public/js/app.js</text>
  <rect class="box" x="40" y="218" width="175" height="58"/>
  <text class="name" x="55" y="243">Styling</text>
  <text class="body" x="55" y="263">public/css/style.css</text>
  <rect class="box" x="40" y="290" width="175" height="96"/>
  <text class="name" x="55" y="315">UI responsibilities</text>
  <text class="body" x="55" y="337">POS · order history</text>
  <text class="body" x="55" y="356">Khata · audit dashboard</text>
  <text class="body" x="55" y="375">Printable invoice link</text>

  <!-- Express entry point -->
  <text class="section" x="270" y="92">APPLICATION ENTRY</text>
  <rect class="box" x="265" y="104" width="180" height="100"/>
  <text class="name" x="282" y="132">server.js</text>
  <text class="body" x="282" y="154">Express app + static UI</text>
  <text class="body" x="282" y="174">mounts /api routers</text>
  <text class="body" x="282" y="194">GET /orders/:id/invoice</text>

  <rect class="config" x="265" y="230" width="180" height="126"/>
  <text class="name" x="282" y="258">config.js</text>
  <text class="body" x="282" y="280">port · shop identity</text>
  <text class="body" x="282" y="300">GST default + HSN slabs</text>
  <text class="body" x="282" y="320">coupon definitions</text>
  <text class="body" x="282" y="340">inventory + admin key</text>

  <!-- Routers -->
  <text class="section" x="485" y="92">ROUTES/</text>
  <rect class="group" x="475" y="104" width="205" height="300"/>
  <rect class="box" x="490" y="120" width="175" height="58"/>
  <text class="name" x="505" y="145">products.js</text>
  <text class="body" x="505" y="165">products · coupons</text>
  <rect class="box" x="490" y="190" width="175" height="70"/>
  <text class="name" x="505" y="215">orders.js</text>
  <text class="body" x="505" y="235">list · get · create</text>
  <text class="body" x="505" y="251">cancel</text>
  <rect class="box" x="490" y="272" width="175" height="58"/>
  <text class="name" x="505" y="297">customers.js</text>
  <text class="body" x="505" y="317">customers · settlements</text>
  <rect class="box" x="490" y="342" width="175" height="48"/>
  <text class="name" x="505" y="364">reports.js</text>
  <text class="body" x="505" y="382">dashboard · preview · export</text>

  <!-- Library modules -->
  <text class="section" x="720" y="92">LIB/ BUSINESS MODULES</text>
  <rect class="group" x="710" y="104" width="465" height="300"/>

  <rect class="box" x="725" y="120" width="135" height="58"/>
  <text class="name" x="739" y="144">store.js</text>
  <text class="body" x="739" y="164">read · write · audit</text>
  <rect class="box" x="875" y="120" width="135" height="58"/>
  <text class="name" x="889" y="144">orders.js</text>
  <text class="body" x="889" y="164">add · get · cancel · list</text>
  <rect class="box" x="1025" y="120" width="135" height="58"/>
  <text class="name" x="1039" y="144">inventory.js</text>
  <text class="body" x="1039" y="164">find · check · reserve</text>

  <rect class="box" x="725" y="194" width="135" height="58"/>
  <text class="name" x="739" y="218">pricing.js</text>
  <text class="body" x="739" y="238">subtotal · computeTotals</text>
  <rect class="box" x="875" y="194" width="135" height="58"/>
  <text class="name" x="889" y="218">coupons.js</text>
  <text class="body" x="889" y="238">validate · discount</text>
  <rect class="highlight" x="1025" y="194" width="135" height="58"/>
  <text class="name" x="1039" y="218">tax.js</text>
  <text class="body" x="1039" y="238">HSN rate · CGST/SGST</text>

  <rect class="box" x="725" y="268" width="135" height="58"/>
  <text class="name" x="739" y="292">ledger.js</text>
  <text class="body" x="739" y="312">Khata charge · settle</text>
  <rect class="highlight" x="875" y="268" width="135" height="58"/>
  <text class="name" x="889" y="292">invoice.js</text>
  <text class="body" x="889" y="312">figures · HTML render</text>
  <rect class="box" x="1025" y="268" width="135" height="58"/>
  <text class="name" x="1039" y="292">reports.js</text>
  <text class="body" x="1039" y="312">summary · reconciliation</text>

  <rect class="box" x="725" y="342" width="135" height="48"/>
  <text class="name" x="739" y="364">dates.js</text>
  <text class="body" x="739" y="382">today · normalize · FY</text>

  <!-- Persistence and legend -->
  <rect class="data" x="725" y="430" width="285" height="86"/>
  <text class="name" x="742" y="458">data/db.json</text>
  <text class="body" x="742" y="479">products · customers · orders · settlements</text>
  <text class="body" x="742" y="499">ID counters · auditLog</text>

  <rect class="box" x="1025" y="430" width="150" height="86"/>
  <text class="name" x="1040" y="453">Legend</text>
  <rect class="highlight" x="1040" y="465" width="18" height="14"/>
  <text class="legend" x="1066" y="477">ticket focus</text>
  <line class="flow-line" x1="1040" y1="495" x2="1060" y2="495"/>
  <text class="legend" x="1066" y="499">order flow</text>

  <!-- Architecture connectors -->
  <path class="flow-line" d="M215 163 H265"/>
  <path class="flow-line" d="M445 154 H475"/>
  <path class="dep-line" d="M665 225 H700 V223 H725"/>
  <path class="dep-line" d="M665 225 H690 V149 H725"/>
  <path class="dep-line" d="M665 225 H700 V297 H725"/>
  <path class="dep-line" d="M860 223 H875"/>
  <path class="dep-line" d="M860 223 H1015 V223 H1025"/>
  <path class="dep-line" d="M445 293 H700 V223 H725"/>
  <path class="dep-line" d="M355 204 V215 H1092 V194"/>
  <path class="dep-line" d="M355 204 V218 H942 V268"/>
  <path class="dep-line" d="M792 178 V430"/>
  <path class="dep-line" d="M942 326 V420 H867 V430"/>

  <!-- Numbered order flow -->
  <text class="section" x="30" y="552">PLACE ORDER · NUMBERED FLOW</text>
  <rect class="group" x="25" y="565" width="1150" height="205"/>

  <rect class="step" x="42" y="585" width="210" height="66"/>
  <circle class="step-num" cx="62" cy="605" r="13"/>
  <text class="step-num-text" x="62" y="605">1</text>
  <text class="name" x="82" y="606">POST /api/orders</text>
  <text class="body" x="57" y="632">Browser → server → orders router</text>

  <rect class="step" x="270" y="585" width="210" height="66"/>
  <circle class="step-num" cx="290" cy="605" r="13"/>
  <text class="step-num-text" x="290" y="605">2</text>
  <text class="name" x="310" y="606">store.read()</text>
  <text class="body" x="285" y="632">Load and parse data/db.json</text>

  <rect class="step" x="498" y="585" width="210" height="66"/>
  <circle class="step-num" cx="518" cy="605" r="13"/>
  <text class="step-num-text" x="518" y="605">3</text>
  <text class="name" x="538" y="606">Resolve + check stock</text>
  <text class="body" x="513" y="632">inventory.find() · check()</text>

  <rect class="step" x="726" y="585" width="210" height="66"/>
  <circle class="step-num" cx="746" cy="605" r="13"/>
  <text class="step-num-text" x="746" y="605">4</text>
  <text class="name" x="766" y="606">Validate coupon</text>
  <text class="body" x="741" y="632">subtotal() · normalizeCode() · validate()</text>

  <rect class="step" x="954" y="585" width="204" height="66"/>
  <circle class="step-num" cx="974" cy="605" r="13"/>
  <text class="step-num-text" x="974" y="605">5</text>
  <text class="name" x="994" y="606">Compute totals</text>
  <text class="body" x="969" y="632">pricing.computeTotals() → tax.js</text>

  <rect class="step" x="42" y="682" width="250" height="66"/>
  <circle class="step-num" cx="62" cy="702" r="13"/>
  <text class="step-num-text" x="62" y="702">6</text>
  <text class="name" x="82" y="703">Charge Khata when selected</text>
  <text class="body" x="57" y="729">ledger.chargeOrderToKhata()</text>

  <rect class="step" x="310" y="682" width="250" height="66"/>
  <circle class="step-num" cx="330" cy="702" r="13"/>
  <text class="step-num-text" x="330" y="702">7</text>
  <text class="name" x="350" y="703">Commit inventory</text>
  <text class="body" x="325" y="729">inventory.reserve()</text>

  <rect class="step" x="578" y="682" width="270" height="66"/>
  <circle class="step-num" cx="598" cy="702" r="13"/>
  <text class="step-num-text" x="598" y="702">8</text>
  <text class="name" x="618" y="703">Add order + audit entry</text>
  <text class="body" x="593" y="729">orders.add() · store.appendAudit()</text>

  <rect class="step" x="866" y="682" width="292" height="66"/>
  <circle class="step-num" cx="886" cy="702" r="13"/>
  <text class="step-num-text" x="886" y="702">9</text>
  <text class="name" x="906" y="703">Persist + respond</text>
  <text class="body" x="881" y="729">store.write(db) → HTTP 201 order JSON</text>

  <path class="flow-line" d="M252 618 H270"/>
  <path class="flow-line" d="M480 618 H498"/>
  <path class="flow-line" d="M708 618 H726"/>
  <path class="flow-line" d="M936 618 H954"/>
  <path class="flow-line" d="M1056 651 V665 H167 V682"/>
  <path class="flow-line" d="M292 715 H310"/>
  <path class="flow-line" d="M560 715 H578"/>
  <path class="flow-line" d="M848 715 H866"/>
</svg>
